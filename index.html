<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTI</title>
<meta name="description" content="Every meme ends. ANTI is where they go.">
<meta property="og:title" content="ANTI">
<meta property="og:description" content="Every meme ends. ANTI is where they go.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://antitoken.wtf/">
<meta property="og:image" content="https://antitoken.wtf/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ANTI — a row of headstones in fog.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://antitoken.wtf/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060606'/%3E%3Crect x='13' y='6' width='6' height='20' fill='%23CC0000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #CC0000;
    --black: #060606;
    --border: #222222;
    --muted: #555555;
    --light: #999999;
    --white: #f0f0f0;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'DM Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.7;
    cursor: crosshair;
    overflow-x: hidden;
  }

  /* ── NOISE OVERLAY ─────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* ── STAGE ─────────────────────────────────────── */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 64px 32px;
    text-align: center;
    overflow: hidden;
  }

  .bg-text {
    position: absolute;
    font-family: var(--font-display);
    font-size: clamp(200px, 30vw, 420px);
    color: rgba(204,0,0,0.04);
    letter-spacing: -10px;
    pointer-events: none;
    user-select: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    animation: breathe 8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.02); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  .wordmark {
    position: relative;
    font-family: var(--font-display);
    font-size: clamp(84px, 17vw, 210px);
    letter-spacing: 12px;
    line-height: 0.9;
    color: var(--red);
    margin-right: -12px; /* optical: cancel trailing letter-space */
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .tagline {
    position: relative;
    font-family: var(--font-mono);
    font-size: 13px;
    font-style: italic;
    color: var(--light);
    max-width: 540px;
    margin-top: 28px;
    animation: fadeUp 0.8s 0.25s ease both;
  }

  .rule {
    position: relative;
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 44px 0;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .status {
    position: relative;
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--white);
    max-width: 540px;
    animation: fadeUp 0.8s 0.5s ease both;
  }

  .links {
    position: relative;
    display: flex;
    gap: 28px;
    margin-top: 56px;
    animation: fadeUp 0.8s 0.65s ease both;
  }

  .links a {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    color: var(--red);
    border-bottom-color: var(--red);
    outline: none;
  }

  footer {
    position: relative;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1px;
    color: #3a3a3a;
    margin-top: 72px;
    animation: fadeUp 0.8s 0.8s ease both;
  }

  @media (max-width: 600px) {
    .wordmark { letter-spacing: 8px; margin-right: -8px; }
    .status { font-size: 14px; }
    .links { gap: 20px; flex-wrap: wrap; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <div class="bg-text" aria-hidden="true">ANTI</div>

  <h1 class="wordmark">ANTI</h1>

  <p class="tagline">Every meme ends. ANTI is where they go.</p>

  <div class="rule" aria-hidden="true"></div>

  <p class="status">Back when there&rsquo;s something true to say.</p>

  <nav class="links">
    <a href="https://x.com/_antitoken" target="_blank" rel="noopener">X</a>
  </nav>

  <footer>Not financial advice. Not a whitepaper. Not a promise.</footer>
</main>

</body>
</html>
